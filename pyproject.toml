[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "services/api/tests", "services/collector/tests", "services/processor/tests", "tools/operations/tests", "tests"]
pythonpath = ["packages/core/src", "services/api/src", "services/collector/src", "services/processor/src", "tools/operations/src", "."]
addopts = "-ra --strict-markers"
markers = [
  "case(id): detailed feature test-plan case ID",
  "feature(id): feature identifier",
  "evidence(basis,level): provenance and verification level for acceptance evidence",
  "integration: requires a running external service",
  "spark: requires Java and PySpark",
  "browser: browser end-to-end verification",
  "performance: sustained performance experiment",
  "live: requires current public feeds",
  "recovery: isolated failure-recovery experiment",
]
junit_family = "xunit2"

[tool.coverage.run]
source = ["packages/core/src", "services/api/src", "services/collector/src", "services/processor/src", "tools/operations/src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
