name: Verify Data Horizon
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, release/source-only]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install locked application and test dependencies
        run: python -m pip install -r requirements.dev.txt
      - name: Static checks
        run: python -m ruff check packages services tools tests scripts conftest.py
      - name: Unit and contract verification
        run: make unit PYTHON=python
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-execution-evidence
          path: reports/raw/
          retention-days: 30
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked UI dependencies
        run: npm ci
        working-directory: frontend
      - name: Verify the independent Node project
        run: |
          npm run lint
          npm test
          npm run build
        working-directory: frontend
      - name: Preserve UI results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-ui-test-evidence
          path: frontend/reports/
          retention-days: 30
