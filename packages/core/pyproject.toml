[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-horizon-core"
version = "0.2.0"
description = "Data Horizon core project"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic==2.14.3",
  "psycopg[binary]==3.3.9",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-cov==7.1.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
data_horizon = ["resources/*.yaml"]
