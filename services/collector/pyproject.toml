[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-horizon-collector"
version = "0.2.0"
description = "Data Horizon collector project"
requires-python = ">=3.11,<3.14"
dependencies = [
  "data-horizon-core==0.2.0",
  "kafka-python==2.2.21",
  "pyarrow==25.0.1",
  "gtfs-realtime-bindings==3.0.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-cov==7.1.0", "httpx==0.28.1"]

[project.scripts]
data-horizon-collector = "data_horizon.collector:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
